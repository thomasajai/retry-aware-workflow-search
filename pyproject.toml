[project]
name = "agentic-system-18"
version = "0.1.0"
description = "Simple MathQA solver workflow using LangGraph and OpenRouter"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
profiling = ["numpy>=2.0", "matplotlib>=3.9"]

[tool.uv]
cache-dir = ".uvcache"
